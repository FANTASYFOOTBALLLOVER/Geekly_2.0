name: Live Stats Polling

on:
  schedule:
    - cron: '*/5 23 * * 4'
    - cron: '*/5 0-3 * * 5'
    - cron: '*/5 13-23 * * 0'
    - cron: '*/5 0-4 * * 1'
    - cron: '*/5 23 * * 1'
    - cron: '*/5 0-4 * * 2'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - run: node scripts/liveStatsLoop.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}